<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absenium — QR Presensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { background-color: #0f0f1a; }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .gradient-text {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.1;
      pointer-events: none;
    }
    .qr-wrapper {
      background: white;
      border-radius: 20px;
      padding: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes countdown-ring {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 94; }
    }
    .countdown-ring {
      animation: countdown-ring 15s linear infinite;
    }
    /* Animasi Success Overlay */
.success-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 20px;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.checkmark-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(16,185,129,0.15);
  border: 3px solid #10b981;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: scaleIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes scaleIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.checkmark-icon {
  font-size: 56px;
  animation: bounceIn 0.6s 0.2s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes bounceIn {
  from { transform: scale(0) rotate(-30deg); opacity: 0; }
  to { transform: scale(1) rotate(0deg); opacity: 1; }
}
.success-text {
  animation: slideUp 0.5s 0.3s ease both;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.success-detail {
  animation: slideUp 0.5s 0.4s ease both;
}
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none;
}
@keyframes confettiFall {
  0% {
    transform: translateY(-100px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

  </style>
</head>
<body class="min-h-screen pb-10 relative overflow-x-hidden">

  <!-- Background Orbs -->
  <div class="orb w-96 h-96 bg-indigo-600 -top-20 -right-20"></div>
  <div class="orb w-80 h-80 bg-purple-600 bottom-20 -left-20"></div>

  <div class="max-w-lg mx-auto p-4 space-y-4">

    <!-- Header -->
    <header class="glass rounded-2xl p-4 flex items-center justify-between">
      <div>
        <h1 class="text-white font-bold text-base" id="app-name">Event Attendance</h1>
        <p class="text-gray-400 text-xs" id="greeting">Selamat datang</p>
      </div>
      <div class="flex items-center gap-2">
        <!-- Admin Button (hanya muncul untuk admin) -->
        <button id="btn-admin" onclick="window.location.href='admin.html'"
          class="hidden px-3 py-2 bg-emerald-600/20 border border-emerald-500/30
            text-emerald-400 text-xs font-semibold rounded-xl hover:bg-emerald-600/30 transition">
          Dashboard
        </button>
        <!-- Avatar -->
        <button onclick="window.location.href='profile.html'"
          class="relative group">
          <img id="user-avatar" src="" alt="Profile"
            class="w-10 h-10 rounded-full border-2 border-white/20
              group-hover:border-indigo-500 transition">
          <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-indigo-600
            rounded-full flex items-center justify-center text-[8px]">✏️</span>
        </button>
      </div>
    </header>

    <!-- User Info Card -->
    <div class="glass rounded-2xl p-4 flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/30
        flex items-center justify-center text-xl flex-shrink-0">
        🪪
      </div>
      <div>
        <p id="user-name" class="text-white font-semibold text-sm">-</p>
        <p id="user-badge" class="text-gray-400 text-xs">Badge: -</p>
        <p id="user-dept" class="text-gray-500 text-[11px]">-</p>
      </div>
      <span id="user-role-badge"
        class="ml-auto px-2 py-1 text-[10px] font-bold rounded-full
          bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex-shrink-0">
        USER
      </span>
    </div>

    <!-- QR Code Card -->
    <div class="glass rounded-2xl p-6 flex flex-col items-center gap-4">
      <div class="flex items-center justify-between w-full">
        <h2 class="text-sm font-semibold text-gray-300">QR Code Presensi Anda</h2>
        <!-- Countdown Ring -->
        <div class="relative w-10 h-10 flex items-center justify-center">
          <svg class="absolute inset-0 -rotate-90" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15"
              fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
            <circle cx="18" cy="18" r="15"
              fill="none" stroke="#6366f1" stroke-width="3"
              stroke-dasharray="94" stroke-dashoffset="0"
              class="countdown-ring" id="progress-ring"/>
          </svg>
          <span id="countdown" class="text-xs font-bold text-indigo-400">15</span>
        </div>
      </div>

      <!-- QR Display -->
      <div id="qr-container" class="qr-wrapper min-h-[216px] min-w-[216px]
        flex items-center justify-center">
        <div class="animate-spin rounded-full h-8 w-8
          border-t-2 border-indigo-500"></div>
      </div>

      <p class="text-gray-500 text-[11px] text-center">
        QR Code diperbarui setiap 15 detik untuk keamanan.<br>
        Tunjukkan QR ini kepada petugas untuk presensi.
      </p>
    </div>

    <!-- Event Aktif -->
    <div class="glass rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-semibold text-gray-300">Event Aktif</h2>
      <div id="events-list" class="space-y-2">
        <div class="flex items-center justify-center py-4">
          <div class="animate-spin rounded-full h-5 w-5
            border-t-2 border-indigo-500"></div>
        </div>
      </div>
    </div>

    <!-- Riwayat Presensi -->
    <div class="glass rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-semibold text-gray-300">Riwayat Presensi Saya</h2>
      <div id="history-list" class="space-y-2">
        <p class="text-gray-500 text-xs text-center py-4">
          Memuat riwayat...
        </p>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
  let user = null;
  let qrTimer = null;
  let countdownVal = CONFIG.QR_REFRESH_INTERVAL;
  let userGps = null;
  let gpsWatcher = null;

  window.onload = async function() {
    user = await requireAuth({ requireProfile: true });
    if (!user) return;

    renderUserInfo();
    await startGPSWatch();
    startQRTimer();
    loadEvents();
    loadHistory();
    startAttendancePolling();
  };

  // ===== USER INFO =====
  function renderUserInfo() {
    document.getElementById("app-name").textContent = "Absenium";
    document.getElementById("greeting").textContent =
      "Halo, " + (user.full_name || user.name || "User");
    document.getElementById("user-name").textContent =
      user.full_name || user.name || "-";
    document.getElementById("user-badge").textContent =
      "Badge: " + (user.badge_number || "-");
    document.getElementById("user-dept").textContent =
      user.department || "";
    document.getElementById("user-role-badge").textContent =
      user.role || "USER";

    if (user.picture) {
      document.getElementById("user-avatar").src = user.picture;
    }

    if (user.role === "ADMIN" || user.role === "SUPERADMIN") {
      document.getElementById("btn-admin").classList.remove("hidden");
    }
  }

  // ===== GPS WATCH =====
  async function startGPSWatch() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        showGPSStatus("warning",
          "GPS tidak tersedia di browser ini."
        );
        resolve();
        return;
      }

      showGPSStatus("loading", "Mengambil lokasi...");

      // Ambil lokasi sekali dulu
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userGps = {
            lat      : pos.coords.latitude,
            lng      : pos.coords.longitude,
            accuracy : pos.coords.accuracy
          };
          showGPSStatus("success",
            `Lokasi aktif (±${Math.round(pos.coords.accuracy)}m)`
          );
          resolve();

          // Lanjut watch untuk update terus
          gpsWatcher = navigator.geolocation.watchPosition(
            (p) => {
              userGps = {
                lat      : p.coords.latitude,
                lng      : p.coords.longitude,
                accuracy : p.coords.accuracy
              };
              showGPSStatus("success",
                `Lokasi aktif (±${Math.round(p.coords.accuracy)}m)`
              );
            },
            () => { /* silent error on watch */ },
            { enableHighAccuracy: true, maximumAge: 10000 }
          );
        },
        (err) => {
          let msg = "GPS tidak aktif.";
          if (err.code === 1) {
            msg = "Izin lokasi ditolak. Event dengan geofencing tidak bisa diikuti.";
          } else if (err.code === 2) {
            msg = "Sinyal GPS lemah.";
          } else if (err.code === 3) {
            msg = "GPS timeout. Coba refresh halaman.";
          }
          showGPSStatus("warning", msg);
          resolve();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  // ===== GPS STATUS DISPLAY =====
  function showGPSStatus(type, msg) {
    // Cek apakah elemen sudah ada
    let el = document.getElementById("gps-status");

    if (!el) {
      // Buat elemen baru dan sisipkan sebelum QR card
      el = document.createElement("div");
      el.id = "gps-status";
      const qrCard = document.getElementById("qr-container")
        .closest(".glass");
      qrCard.parentNode.insertBefore(el, qrCard);
    }

    const styles = {
      loading : "bg-amber-500/10 border border-amber-500/30 text-amber-400",
      success : "bg-emerald-500/10 border border-emerald-500/30 text-emerald-400",
      warning : "bg-rose-500/10 border border-rose-500/30 text-rose-400"
    };

    const icons = {
      loading : `<div class="animate-spin rounded-full h-3 w-3
                  border-t border-amber-400 flex-shrink-0"></div>`,
      success : `<span>📍</span>`,
      warning : `<span>⚠️</span>`
    };

    el.className = `flex items-center gap-2 p-3 rounded-xl
      text-xs ${styles[type]}`;
    el.innerHTML = `${icons[type]}<span>${msg}</span>`;
  }

  // ===== QR CODE =====
  function startQRTimer() {
    fetchQR();
    if (qrTimer) clearInterval(qrTimer);
    countdownVal = CONFIG.QR_REFRESH_INTERVAL;

    qrTimer = setInterval(() => {
      countdownVal--;
      document.getElementById("countdown").textContent = countdownVal;

      if (countdownVal <= 0) {
        fetchQR();
        countdownVal = CONFIG.QR_REFRESH_INTERVAL;
      }
    }, 1000);
  }

  async function fetchQR() {
    const result = await callAPI("generateQRToken", {
      // Kirim GPS user ke server untuk dimasukkan ke token
      userLat : userGps ? userGps.lat : null,
      userLng : userGps ? userGps.lng : null
    });

    if (!result.success || result.error) {
      document.getElementById("qr-container").innerHTML = `
        <p class="text-rose-400 text-xs text-center p-4">
          Gagal generate QR.<br>Refresh halaman.
        </p>`;
      return;
    }

    const container = document.getElementById("qr-container");
    container.innerHTML = "";
    new QRCode(container, {
      text          : result.qrData,
      width         : 200,
      height        : 200,
      colorDark     : "#000000",
      colorLight    : "#ffffff",
      correctLevel  : QRCode.CorrectLevel.M
    });
  }

  // ===== EVENTS =====
  async function loadEvents() {
    const result = await callAPI("getActiveEvents");
    const container = document.getElementById("events-list");

    if (!result.success || !result.events || result.events.length === 0) {
      container.innerHTML = `
        <p class="text-gray-500 text-xs text-center py-3">
          Tidak ada event aktif saat ini.
        </p>`;
      return;
    }

    container.innerHTML = result.events.map(event => `
      <div class="flex items-center gap-3 p-3
        bg-white/5 rounded-xl">
        <div class="w-8 h-8 rounded-lg bg-emerald-600/20
          border border-emerald-500/30 flex items-center
          justify-center text-sm flex-shrink-0">
          📅
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-xs font-medium truncate">
            ${event.title}
          </p>
          <p class="text-gray-500 text-[10px]">
            Sampai: ${formatDateTime(event.endTime)}
            ${event.geofencingEnabled
              ? `· 📍 Radius ${event.geo_radius}m`
              : "· 🌐 Tanpa geofencing"
            }
          </p>
        </div>
        <span class="px-2 py-1 bg-emerald-500/20 text-emerald-400
          text-[10px] font-bold rounded-full
          border border-emerald-500/30 flex-shrink-0">
          AKTIF
        </span>
      </div>
    `).join("");
  }

  // ===== HISTORY =====
  async function loadHistory() {
  const result = await callAPI("getUserAttendanceHistory");
  const container = document.getElementById("history-list");

  if (!result.success || !result.logs || result.logs.length === 0) {
    container.innerHTML = `
      <p class="text-gray-500 text-xs text-center py-3">
        Belum ada riwayat presensi.
      </p>`;
    return;
  }

  container.innerHTML = result.logs.map(log => `
    <div class="flex items-center gap-3 p-3
      bg-white/5 rounded-xl">

      <div class="w-8 h-8 rounded-lg bg-indigo-600/20
        border border-indigo-500/30 flex items-center
        justify-center text-sm flex-shrink-0">
        ✅
      </div>

      <div class="flex-1 min-w-0">
        <p class="text-white text-xs font-medium truncate">
          ${log.eventTitle || "Event"}
        </p>
        <p class="text-gray-500 text-[10px]">
          ${formatDateTime(log.timestamp)}
        </p>
      </div>

      <span class="px-2 py-1 bg-indigo-500/20 text-indigo-400
        text-[10px] font-bold rounded-full
        border border-indigo-500/30 flex-shrink-0">
        HADIR
      </span>

    </div>
  `).join("");
}
// ===== ATTENDANCE POLLING =====
let attendancePoller = null;
let alreadyNotified = [];

function startAttendancePolling() {
  // Poll setiap 5 detik
  attendancePoller = setInterval(async () => {
    await checkAttendanceStatus();
  }, 5000);
}

async function checkAttendanceStatus() {
  const result = await callAPI("getUserAttendanceHistory");
  if (!result.success || !result.logs || result.logs.length === 0) return;

  // Ambil log terbaru
  const latestLog = result.logs[0];
  if (!latestLog) return;

  // Cek apakah presensi ini baru (dalam 30 detik terakhir)
  const logTime = new Date(latestLog.timestamp).getTime();
  const now = Date.now();
  const isRecent = (now - logTime) < 30000; // 30 detik

  // Cek apakah sudah pernah dinotifikasi
  const alreadyShown = alreadyNotified.includes(latestLog.log_id);

  if (isRecent && !alreadyShown) {
    alreadyNotified.push(latestLog.log_id);
    showSuccessOverlay(latestLog);
  }
}

// ===== SUCCESS OVERLAY =====
function showSuccessOverlay(log) {
  // Stop QR timer sementara
  if (qrTimer) clearInterval(qrTimer);

  // Buat confetti
  spawnConfetti();

  // Buat overlay
  const overlay = document.createElement("div");
  overlay.id = "success-overlay";
  overlay.className = "success-overlay";
  overlay.innerHTML = `
    <div class="checkmark-circle">
      <span class="checkmark-icon">✅</span>
    </div>

    <div class="success-text text-center space-y-1">
      <h2 class="text-white text-2xl font-bold">
        Presensi Berhasil!
      </h2>
      <p class="text-emerald-400 text-sm font-medium">
        Kehadiran Anda telah tercatat
      </p>
    </div>

    <div class="success-detail glass rounded-2xl p-4
      w-full max-w-xs space-y-2 mx-4">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📅</span>
        <div>
          <p class="text-gray-400 text-xs">Event</p>
          <p class="text-white text-sm font-semibold">
            ${log.eventTitle || "Event"}
          </p>
        </div>
      </div>
      <div class="h-px bg-white/10"></div>
      <div class="flex items-center gap-3">
        <span class="text-2xl">🕐</span>
        <div>
          <p class="text-gray-400 text-xs">Waktu Presensi</p>
          <p class="text-white text-sm font-semibold">
            ${formatDateTime(log.timestamp)}
          </p>
        </div>
      </div>
      <div class="h-px bg-white/10"></div>
      <div class="flex items-center gap-3">
        <span class="text-2xl">🪪</span>
        <div>
          <p class="text-gray-400 text-xs">Badge</p>
          <p class="text-white text-sm font-semibold">
            ${user.full_name || user.name || "-"}
          </p>
        </div>
      </div>
    </div>

    <button onclick="closeSuccessOverlay()"
      class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700
        text-white font-bold rounded-2xl text-sm transition
        success-detail">
      Tutup
    </button>

    <p class="text-gray-500 text-xs success-detail">
      Menutup otomatis dalam <span id="close-countdown">10</span> detik
    </p>
  `;

  document.body.appendChild(overlay);

  // Auto close countdown
  let closeCount = 10;
  const closeTimer = setInterval(() => {
    closeCount--;
    const el = document.getElementById("close-countdown");
    if (el) el.textContent = closeCount;
    if (closeCount <= 0) {
      clearInterval(closeTimer);
      closeSuccessOverlay();
    }
  }, 1000);

  // Simpan timer untuk di-clear saat tutup manual
  overlay.dataset.closeTimer = closeTimer;
}

function closeSuccessOverlay() {
  const overlay = document.getElementById("success-overlay");
  if (!overlay) return;

  // Clear auto close timer
  if (overlay.dataset.closeTimer) {
    clearInterval(parseInt(overlay.dataset.closeTimer));
  }

  // Animasi keluar
  overlay.style.opacity = "0";
  overlay.style.transition = "opacity 0.3s ease";

  setTimeout(() => {
    overlay.remove();
    // Restart QR timer
    startQRTimer();
    // Reload history
    loadHistory();
  }, 300);
}

// ===== CONFETTI =====
function spawnConfetti() {
  const colors = [
    "#6366f1", "#8b5cf6", "#10b981",
    "#f59e0b", "#ef4444", "#3b82f6"
  ];

  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement("div");
      el.className = "confetti";
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: -10px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        width: ${Math.random() * 10 + 5}px;
        height: ${Math.random() * 10 + 5}px;
        animation-duration: ${Math.random() * 2 + 2}s;
        animation-delay: ${Math.random() * 0.5}s;
        border-radius: ${Math.random() > 0.5 ? "50%" : "2px"};
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 30);
  }
}

  // Cleanup saat halaman ditinggal
  window.addEventListener("beforeunload", () => {
    if (qrTimer) clearInterval(qrTimer);
    if (gpsWatcher) navigator.geolocation.clearWatch(gpsWatcher);
    if (attendancePoller) clearInterval(attendancePoller);
  });
</script>

</body>
</html>
